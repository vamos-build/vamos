{{- /*
The coordinator: one instance, which keeps its build cache and its jobs on a volume, and resumes the jobs when it
starts again, on this node or another.
A StatefulSet, so that a replacement starts only once the old instance has stopped writing the cache and the jobs.
*/}}
{{- $t := include "vamos.telemetryValues" . | fromYaml }}
{{- $port := 0 }}
{{- if $t.prometheus.enabled }}
{{- $port = $t.prometheus.port | toString | atoi }}
{{- if or (lt $port 1) (gt $port 65535) (ne ($port | toString) ($t.prometheus.port | toString)) }}
{{- fail (printf "telemetry.prometheus.port %v isn't a port, a whole number from 1 to 65535" $t.prometheus.port) }}
{{- end }}
{{- if has $port (list (.Values.coordinator.service.port | toString | atoi) 8080) }}
{{- fail (printf "telemetry.prometheus.port %v is the coordinator's API's port, its Service's or its own, 8080" $port) }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "vamos.fullname" . }}-coordinator
  labels:
    {{- include "vamos.labels" . | nindent 4 }}
    {{- include "vamos.selectorLabels" (dict "root" . "component" "coordinator") | nindent 4 }}
  {{- with .Values.coordinator.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- $service := .Values.coordinator.service }}
  {{- $metrics := ternary $port nil $t.prometheus.enabled }}
  {{- include "vamos.serviceSpec" (dict "root" . "component" "coordinator" "service" $service
        "metricsPort" $metrics) | nindent 2 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "vamos.fullname" . }}-coordinator
  labels:
    {{- include "vamos.labels" . | nindent 4 }}
    {{- include "vamos.selectorLabels" (dict "root" . "component" "coordinator") | nindent 4 }}
spec:
  replicas: 1 # a client refuses a second instance's answers, so there is never more than one
  serviceName: {{ include "vamos.fullname" . }}-coordinator
  selector:
    matchLabels:
      {{- include "vamos.selectorLabels" (dict "root" . "component" "coordinator") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "vamos.labels" . | nindent 8 }}
        {{- include "vamos.selectorLabels" (dict "root" . "component" "coordinator") | nindent 8 }}
        {{- with .Values.coordinator.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- /* A change of registry settings restarts the coordinator, which reads them once. Scrape annotations, if
               asked for, come before the pod's own, which override them, all rendered once. */}}
        {{- $annotations := dict }}
        {{- if and $t.prometheus.enabled $t.prometheus.podAnnotations }}
        {{- $annotations = dict "prometheus.io/scrape" "true" "prometheus.io/port" ($port | toString)
              "prometheus.io/path" "/metrics" }}
        {{- end }}
        {{- $annotations = mergeOverwrite $annotations (deepCopy (.Values.coordinator.podAnnotations | default dict)) }}
        {{- $_ := set $annotations "checksum/registries"
              (include (print $.Template.BasePath "/registries-configmap.yaml") . | sha256sum) }}
        {{- toYaml $annotations | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.coordinator.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: coordinator
          image: {{ include "vamos.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - coordinator
            - --listen=:8080
            - --cache-dir=/var/lib/vamos
            - --cache-repository={{ include "vamos.cacheRegistry" . }}/{{ .Values.cacheRegistry.repository }}
            {{- range include "vamos.pullThroughMappings" . | trim | splitList "\n" | compact }}
            - --pull-through={{ . }}
            {{- end }}
            {{- range include "vamos.poolPlatforms" . | trim | splitList "\n" | compact }}
            - --offer={{ . }}
            {{- end }}
            {{- with .Values.coordinator.defaultExecPlatform }}
            {{- if not (has . (include "vamos.poolPlatforms" $ | trim | splitList "\n")) }}
            {{- fail (printf "coordinator.defaultExecPlatform %s is neither a pool's platform nor in %s" .
                  "coordinator.offer") }}
            {{- end }}
            - --default-exec-platform={{ . }}
            {{- end }}
            {{- range .Values.coordinator.offerEmulated }}
            - --offer-emulated={{ . }}
            {{- end }}
            {{- with .Values.coordinator.grace }}
            - --grace={{ . }}
            {{- end }}
            {{- with .Values.coordinator.window }}
            - --window={{ . }}
            {{- end }}
            {{- with .Values.coordinator.lease }}
            - --lease={{ . }}
            {{- end }}
            {{- if not (kindIs "invalid" .Values.coordinator.retries) }}
            - --retries={{ .Values.coordinator.retries }}
            {{- end }}
            {{- if not (kindIs "invalid" .Values.coordinator.bound) }}
            - --bound={{ .Values.coordinator.bound }}
            {{- end }}
            {{- if not (kindIs "invalid" .Values.coordinator.maxBuilds) }}
            - --max-builds={{ .Values.coordinator.maxBuilds }}
            {{- end }}
            {{- with .Values.coordinator.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            - name: CONTAINERS_REGISTRIES_CONF
              value: /etc/vamos/registries.conf
            {{- if .Values.coordinator.authSecret }}
            {{- include "vamos.authEnv" (dict "secret" .Values.coordinator.authSecret) | nindent 12 }}
            {{- end }}
            {{- with include "vamos.telemetryEnv" (dict "root" . "role" "coordinator"
                  "extraEnv" .Values.coordinator.extraEnv) | trim }}
            {{- . | nindent 12 }}
            {{- end }}
            {{- with .Values.coordinator.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            {{- if $t.prometheus.enabled }}
            - name: metrics
              containerPort: {{ $port }}
              protocol: TCP
            {{- end }}
          # The capabilities answer once the coordinator serves; until then clients get nothing from it anyway.
          readinessProbe:
            httpGet:
              path: /v1/capabilities
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /v1/capabilities
              port: http
            periodSeconds: 10
            failureThreshold: 6
          {{- with .Values.coordinator.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.coordinator.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: cache
              mountPath: /var/lib/vamos
            {{- include "vamos.registriesMount" . | nindent 12 }}
            {{- if .Values.coordinator.authSecret }}
            {{- include "vamos.authMount" (dict "secret" .Values.coordinator.authSecret) | nindent 12 }}
            {{- end }}
      # The coordinator cuts its connections within ten seconds of being told to stop, then sends what its telemetry
      # holds within ten more; its jobs are on the volume as they were, for the next instance to resume.
      {{- $grace := "" }}
      {{- $raw := .Values.coordinator.terminationGracePeriodSeconds }}
      {{- if and (kindIs "float64" $raw) (eq (floor $raw) $raw) (lt $raw 9e15) }}
      {{- /* A YAML number, which Helm reads as a float, such as 1e+06, while it is exact; a larger one is refused. */}}
      {{- $grace = $raw | int64 | toString }}
      {{- else if not (kindIs "invalid" $raw) }}
      {{- $grace = $raw | toString | trim }}
      {{- end }}
      {{- if and (ne $grace "") (or (lt ($grace | atoi) 0) (ne ($grace | atoi | toString) $grace)) }}
      {{- fail (printf "coordinator.terminationGracePeriodSeconds %q isn't a whole number of seconds, 0 or more, written as an integer"
            $grace) }}
      {{- end }}
      terminationGracePeriodSeconds: {{ ternary 45 ($grace | atoi) (eq $grace "") }}
      volumes:
        {{- include "vamos.registriesVolume" . | nindent 8 }}
        {{- if .Values.coordinator.authSecret }}
        {{- include "vamos.authVolume" (dict "secret" .Values.coordinator.authSecret) | nindent 8 }}
        {{- end }}
        {{- if not .Values.coordinator.persistence.enabled }}
        - name: cache
          emptyDir: {}
        {{- end }}
      {{- with .Values.coordinator.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.coordinator.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.coordinator.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if .Values.coordinator.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: cache
        labels:
          {{- include "vamos.selectorLabels" (dict "root" . "component" "coordinator") | nindent 10 }}
      spec:
        {{- include "vamos.pvcSpec" .Values.coordinator.persistence | nindent 8 }}
  {{- end }}
