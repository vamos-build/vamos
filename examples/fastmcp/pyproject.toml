# Tool settings only; dependencies live in requirements*.txt.

[tool.ruff]
line-length = 120
target-version = "py315"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", # conflicts with the formatter
    "CPY001", # the repository has no copyright headers
    "D203",   # incompatible with D211
    "D213",   # incompatible with D212
]

[tool.ruff.lint.per-file-ignores]
"test_*.py" = [
    "D103", # test names describe the test
    "S101", # pytest uses assert
]

[tool.pyright]
pythonVersion = "3.15"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
# Checks beyond strict.
reportImplicitOverride = "error"
reportImplicitStringConcatenation = "error"
reportImportCycles = "error"
reportMissingSuperCall = "error"
reportPropertyTypeMismatch = "error"
reportUninitializedInstanceVariable = "error"
reportUnnecessaryTypeIgnoreComment = "error"
reportUnusedCallResult = "error"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["--strict-config", "--strict-markers"]
filterwarnings = [
    "error",
    # Python 3.15 deprecates isinstance() on protocols that aren't @runtime_checkable, which beartype reports for
    # py-key-value-aio 0.4.6's AsyncKeyValue. Drop this once the lock takes a py-key-value-aio that decorates it.
    "ignore:<class 'key_value.aio.protocols.key_value.AsyncKeyValue'> isn't explicitly decorated with @runtime_checkable:DeprecationWarning",
]
