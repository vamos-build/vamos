name: strawberry-graphql

services:

  ui:
    image: strawberry-ui

  backend:
    image: strawberry-backend
    # Healthy once the server accepts connections, so that the ingress, and `up --wait`, wait for it.
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8000), 1)"]
      interval: 1s
      retries: 30

  # This functions like an HTTP load balancer would in a production environment.
  ingress:
    image: nginx
    ports:
      - "8080:80"
    depends_on:
      ui:
        condition: service_started
      backend:
        condition: service_healthy
    configs:
      - source: ingress-config
        target: /etc/nginx/conf.d/default.conf

configs:
  ingress-config:
    content: |
      server {
        listen       80;
        server_name  localhost;

        location /graphql {
            proxy_pass http://backend:8000;
        }

        location / {
            proxy_pass http://ui:80;
        }
      }
